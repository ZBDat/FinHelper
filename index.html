<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinHelper 全球指数监控（日K）</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --line: #e6eaf0;
            --text: #20262f;
            --muted: #5f6b7a;
            --up: #0f8f46;
            --down: #d23a3a;
            --primary: #2f67ff;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .page { padding: 14px; display: grid; gap: 12px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
        .title { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        h1,h2,h3,p { margin: 0; }
        h1 { font-size: 21px; }
        h2 { font-size: 16px; margin-bottom: 8px; }
        .muted { color: var(--muted); font-size: 13px; }
        .grid-overview { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
        .kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfcff; }
        .kpi .v { font-size: 20px; font-weight: 700; margin-top: 4px; }
        .up { color: var(--up); }
        .down { color: var(--down); }
        .workspace { display: grid; gap: 12px; grid-template-columns: minmax(360px,1.2fr) minmax(400px,1.4fr) minmax(260px,1fr); }
        .chart { width: 100%; height: 320px; }
        .side { display: grid; gap: 8px; max-height: 620px; overflow: auto; }
        .side-item { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: #fbfcff; }
        .line { display: flex; justify-content: space-between; margin-top: 4px; font-size: 13px; gap: 8px; }
        .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        select, textarea, button { border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
        select, button { padding: 8px 10px; background: #fff; }
        button { cursor: pointer; border: none; background: var(--primary); color: #fff; }
        button.secondary { background: #6f7f94; }
        textarea { width: 100%; min-height: 90px; padding: 8px; resize: vertical; }
        .status-dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; background: #999; }
        .status-dot.ok { background: #1aa151; }
        .status-dot.err { background: #cb3f3f; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        @media (max-width: 980px) {
            .workspace { grid-template-columns: 1fr; }
            .chart { height: 290px; }
            .side { max-height: none; }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="card title">
        <div>
            <h1>FinHelper 全球指数监控（日K）</h1>
            <p class="muted" id="metaInfo">加载中...</p>
        </div>
        <div class="title">
            <span id="connDot" class="status-dot"></span>
            <span id="connText" class="muted">连接中...</span>
        </div>
    </div>

    <div class="card">
        <h2>四大市场总览</h2>
        <div class="grid-overview" id="overviewCards"></div>
    </div>

    <div class="workspace">
        <div class="card">
            <h2>统一单位对比（Rebased=100）</h2>
            <div id="compareChart" class="chart"></div>
        </div>

        <div class="card">
            <h2>市场拆解（日K）</h2>
            <div class="controls">
                <label class="muted" for="marketSelect">市场</label>
                <select id="marketSelect">
                    <option value="cn">A股</option>
                    <option value="us">美股</option>
                    <option value="hk">港股</option>
                    <option value="eu">欧洲</option>
                </select>
                <button class="secondary" id="refreshBtn">刷新</button>
            </div>
            <div id="drilldownChart" class="chart"></div>
        </div>

        <div class="card">
            <h2>指数明细</h2>
            <div id="indexBoard" class="side"></div>
        </div>
    </div>

    <div class="card">
        <h2>DeepSeek 资金流解读（预留API Key）</h2>
        <div class="controls">
            <button id="analyzeBtn">分析当前市场</button>
        </div>
        <textarea id="flowSummary" placeholder="可选：补充你关注的资金流观察点"></textarea>
        <p class="muted" id="analysisMeta" style="margin-top:8px;">尚未分析</p>
        <div class="card" style="margin-top:8px; background:#fbfcff;"><p id="analysisText" class="mono">等待调用...</p></div>
    </div>
</div>

<script>
    const apiBase = new URLSearchParams(window.location.search).get('apiBase') || '';
    const marketNames = { cn: 'A股', us: '美股', hk: '港股', eu: '欧洲' };
    const connDot = document.getElementById('connDot');
    const connText = document.getElementById('connText');
    const marketSelect = document.getElementById('marketSelect');
    const overviewCards = document.getElementById('overviewCards');
    const indexBoard = document.getElementById('indexBoard');

    let currentSnapshot = null;
    let eventSource = null;

    const fmtNum = (n) => Number.isFinite(n) ? Number(n).toFixed(2) : '-';
    const fmtPct = (n) => Number.isFinite(n) ? `${(n * 100).toFixed(2)}%` : '-';
    const cls = (n) => n > 0 ? 'up' : (n < 0 ? 'down' : '');

    function renderOverview(marketData) {
        const cards = marketData.overview || [];
        overviewCards.innerHTML = cards.map(item => `
            <div class="kpi">
                <h3>${item.name}</h3>
                <p class="muted">${item.description}</p>
                <div class="line"><span class="muted">指数数量</span><span>${item.index_count}</span></div>
                <div class="line"><span class="muted">原始均值</span><span>${fmtNum(item.avg_raw_close)}</span></div>
                <div class="line"><span class="muted">统一单位均值(CNY)</span><span>${fmtNum(item.avg_normalized_close)}</span></div>
                <div class="line"><span class="muted">日涨跌</span><span class="${cls(item.avg_day_change_pct)}">${fmtPct(item.avg_day_change_pct)}</span></div>
            </div>
        `).join('');
    }

    function renderComparison(marketData) {
        const rows = marketData.comparison_curve || [];
        const x = rows.map(r => new Date(r.ts * 1000));
        const series = ['cn', 'us', 'hk', 'eu'].map(key => ({
            x,
            y: rows.map(r => r[key]),
            mode: 'lines',
            name: marketNames[key]
        }));
        Plotly.react('compareChart', series, {
            margin: { l: 46, r: 12, t: 10, b: 34 },
            xaxis: { type: 'date' },
            yaxis: { title: '统一单位对比(Rebased=100)' }
        }, { responsive: true, displaylogo: false });
    }

    function renderDrilldown(marketData, marketKey) {
        const indices = (marketData.drilldown || {})[marketKey] || [];
        const traces = indices.map(idx => ({
            x: (idx.points || []).map(p => new Date(p.ts * 1000)),
            y: (idx.points || []).map(p => p.normalized_close),
            mode: 'lines',
            name: idx.name
        }));
        Plotly.react('drilldownChart', traces, {
            margin: { l: 46, r: 12, t: 10, b: 34 },
            xaxis: { type: 'date' },
            yaxis: { title: '标准化值 (CNY)' }
        }, { responsive: true, displaylogo: false });

        indexBoard.innerHTML = indices.map(idx => `
            <div class="side-item">
                <h3>${idx.name}</h3>
                <div class="line"><span class="muted">代码</span><span>${idx.code}</span></div>
                <div class="line"><span class="muted">币种</span><span>${idx.currency}</span></div>
                <div class="line"><span class="muted">原始收盘</span><span>${fmtNum(idx.raw_close)}</span></div>
                <div class="line"><span class="muted">标准化值(CNY)</span><span>${fmtNum(idx.normalized_close)}</span></div>
                <div class="line"><span class="muted">日涨跌</span><span class="${cls(idx.day_change_pct)}">${fmtPct(idx.day_change_pct)}</span></div>
                <div class="line"><span class="muted">口径</span><span>${idx.stat_mode} ÷ ${fmtNum(idx.stat_divisor)}</span></div>
            </div>
        `).join('') || '<p class="muted">暂无数据</p>';
    }

    function renderSnapshot(data) {
        currentSnapshot = data;
        const marketData = data.market_monitor || { overview: [], drilldown: {}, comparison_curve: [] };
        renderOverview(marketData);
        renderComparison(marketData);
        renderDrilldown(marketData, marketSelect.value);

        const updated = marketData.updated_at ? new Date(marketData.updated_at * 1000).toLocaleString() : '-';
        const fx = marketData.fx_rates || {};
        document.getElementById('metaInfo').textContent = `时间粒度: ${marketData.normalization?.timeframe || '日K'} ｜ 基准币种: ${marketData.base_currency || 'CNY'} ｜ 汇率 USD:${fmtNum(fx.USD)} HKD:${fmtNum(fx.HKD)} EUR:${fmtNum(fx.EUR)} ｜ 更新时间: ${updated}`;
    }

    async function loadSnapshot() {
        const r = await fetch(`${apiBase}/api/snapshot`);
        const payload = await r.json();
        if (payload.ok) renderSnapshot(payload.data);
    }

    async function analyzeFlow() {
        const market = marketSelect.value;
        const summary = document.getElementById('flowSummary').value;
        const r = await fetch(`${apiBase}/api/deepseek/fund-flow`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ market, summary })
        });
        const payload = await r.json();
        const data = payload.data || {};
        document.getElementById('analysisText').textContent = data.analysis || data.error || '暂无返回';
        const ts = data.last_updated ? new Date(data.last_updated * 1000).toLocaleString() : '-';
        const mode = data.degraded ? '降级模式' : '在线模式';
        document.getElementById('analysisMeta').textContent = `状态: ${mode} ｜ 更新时间: ${ts}`;
    }

    function connectEvents() {
        if (eventSource) eventSource.close();
        const es = new EventSource(`${apiBase}/api/events`);
        eventSource = es;

        es.addEventListener('snapshot', (evt) => {
            connDot.className = 'status-dot ok';
            connText.textContent = '实时连接正常';
            try {
                renderSnapshot(JSON.parse(evt.data));
            } catch (e) {
                console.error(e);
            }
        });
        es.onerror = () => {
            connDot.className = 'status-dot err';
            connText.textContent = '连接中断，自动重连...';
        };
    }

    marketSelect.addEventListener('change', () => {
        if (currentSnapshot) renderDrilldown(currentSnapshot.market_monitor || {}, marketSelect.value);
    });
    document.getElementById('refreshBtn').addEventListener('click', () => loadSnapshot());
    document.getElementById('analyzeBtn').addEventListener('click', () => analyzeFlow());

    loadSnapshot();
    connectEvents();
</script>
</body>
</html>
